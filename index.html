<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="皮皮漫步 — 輕鬆同步 Zepp Life 步數">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>皮皮漫步 — 輕鬆刷步數</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase 10.x Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0a0a0f] text-[#f0f0f5] font-body min-h-screen overflow-x-hidden">
    <!-- Background Effects -->
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <!-- Screen 1: Onboarding -->
    <div id="screen-onboarding" class="screen flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto min-h-screen">
        <div class="logo-container flex items-center justify-center mb-6 animate-float">
            <span class="text-5xl">🐾</span>
        </div>
        <h1 class="brand-title text-4xl mb-2 text-center">皮皮漫步</h1>
        <p class="brand-subtitle text-center mb-10 text-[var(--text-secondary)]">與親友一起漫步，輕鬆同步步數</p>

        <div class="w-full space-y-4 mb-10">
            <div class="tutorial-step glass-card p-4 flex items-start gap-4 animate-slide-up" style="animation-delay: 0.1s">
                <div class="tutorial-step-number flex-shrink-0 text-white font-bold font-display">1</div>
                <div>
                    <h3 class="tutorial-step-title mb-1 text-white">📱 下載 Zepp Life</h3>
                    <p class="tutorial-step-desc text-sm">請先在手機下載並安裝 Zepp Life App</p>
                </div>
            </div>
            <div class="tutorial-step glass-card p-4 flex items-start gap-4 animate-slide-up" style="animation-delay: 0.2s">
                <div class="tutorial-step-number flex-shrink-0 text-white font-bold font-display">2</div>
                <div>
                    <h3 class="tutorial-step-title mb-1 text-white">⚠️ 使用信箱註冊</h3>
                    <p class="tutorial-step-desc text-sm">請使用 Email 或手機號碼註冊，<strong class="text-[var(--accent-orange)]">請勿</strong>使用 Google/Apple/WeChat 快速登入</p>
                </div>
            </div>
            <div class="tutorial-step glass-card p-4 flex items-start gap-4 animate-slide-up" style="animation-delay: 0.3s">
                <div class="tutorial-step-number flex-shrink-0 text-white font-bold font-display">3</div>
                <div>
                    <h3 class="tutorial-step-title mb-1 text-white">🔑 回來登入</h3>
                    <p class="tutorial-step-desc text-sm">在 Zepp Life 註冊完成後，回到這裡登入</p>
                </div>
            </div>
        </div>

        <button id="btn-start" class="btn-primary w-full py-4 text-lg font-bold animate-slide-up" style="animation-delay: 0.4s">
            ✨ 開始使用
        </button>
    </div>

    <!-- Screen 2: Login -->
    <div id="screen-login" class="screen hidden flex-col items-center justify-center p-6 w-full max-w-md mx-auto min-h-screen relative">
        <button id="btn-back-tutorial" class="absolute top-6 left-6 text-[var(--text-secondary)] hover:text-white transition-colors bg-transparent border-none cursor-pointer p-2">
            <i class="fa-solid fa-arrow-left mr-2"></i>返回教學
        </button>

        <div class="logo-container flex items-center justify-center mb-4 animate-float w-16 h-16">
            <span class="text-3xl">🐾</span>
        </div>
        <h1 class="brand-title text-2xl mb-8 text-center">皮皮漫步</h1>

        <div class="glass-card w-full p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-center mb-6 text-white">登入 Zepp Life</h2>
            
            <form id="login-form" class="space-y-4">
                <div id="login-error" class="alert-banner hidden p-3 rounded-lg bg-red-500/20 text-red-200 text-sm border border-red-500/30 flex items-start gap-2">
                    <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                    <span id="login-error-text">登入失敗</span>
                </div>

                <div>
                    <label class="block text-sm text-[var(--text-secondary)] mb-1 pl-1">帳號（Email 或手機）</label>
                    <input type="text" id="login-account" required class="input-field w-full px-4 py-3 rounded-xl text-white outline-none" placeholder="輸入 Zepp Life 帳號">
                </div>
                
                <div>
                    <label class="block text-sm text-[var(--text-secondary)] mb-1 pl-1">密碼</label>
                    <div class="relative">
                        <input type="password" id="login-password" required class="input-field w-full px-4 py-3 rounded-xl text-white outline-none pr-12" placeholder="輸入密碼">
                        <button type="button" id="btn-toggle-pwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-[var(--text-secondary)] hover:text-white focus:outline-none bg-transparent border-none cursor-pointer">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-[var(--text-secondary)] mb-1 pl-1">暱稱（風雲榜顯示）</label>
                    <input type="text" id="login-nickname" class="input-field w-full px-4 py-3 rounded-xl text-white outline-none" placeholder="不填則使用帳號前綴">
                </div>

                <button type="submit" id="btn-login-submit" class="btn-primary w-full py-4 mt-6 font-bold flex items-center justify-center gap-2">
                    <span>🚀 登入</span>
                    <i class="fa-solid fa-circle-notch fa-spin hidden spinner"></i>
                </button>
            </form>

            <div class="mt-6 text-xs text-[var(--text-tertiary)] text-center flex justify-center items-center gap-1">
                <i class="fa-solid fa-lock"></i>
                <p>你的帳號資訊僅用於驗證，不會儲存。</p>
            </div>
        </div>
    </div>

    <!-- Screen 3: Dashboard -->
    <div id="screen-dashboard" class="screen hidden flex-col p-4 w-full max-w-md mx-auto min-h-screen pb-12">
        <!-- Nav -->
        <nav class="nav-bar mb-6 items-center">
            <div class="nav-title text-xl flex items-center gap-2">
                🐾 <span class="brand-title text-2xl">皮皮漫步</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="user-nickname-display" class="text-sm font-medium text-[var(--text-secondary)]"></span>
                <button id="btn-logout" class="btn-secondary px-3 py-1.5 rounded-lg text-sm bg-transparent border border-[var(--border-medium)] cursor-pointer text-white">
                    登出
                </button>
            </div>
        </nav>

        <!-- Main Card -->
        <div class="glass-card-strong p-6 mb-6 text-center animate-slide-down">
            <p class="text-sm text-[var(--text-secondary)] mb-2 font-medium">📅 今日已新增步數</p>
            <div class="flex items-baseline justify-center gap-1">
                <div id="step-count-display" class="stat-number">0</div>
                <span class="text-[var(--text-secondary)] font-medium">步</span>
            </div>
        </div>

        <!-- Quick Add -->
        <div class="mb-8 animate-slide-up" style="animation-delay: 0.1s">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-white">
                ⚡ 快捷新增
            </h3>
            <div class="grid grid-cols-2 gap-3" id="quick-steps-grid">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Custom Add -->
        <div class="mb-8 animate-slide-up" style="animation-delay: 0.2s">
            <button id="btn-toggle-custom" class="w-full text-left text-[var(--text-secondary)] hover:text-white transition-colors bg-transparent border-none cursor-pointer py-2 flex items-center justify-between">
                <span class="font-medium">✏️ 自訂步數</span>
                <i class="fa-solid fa-chevron-down transition-transform duration-300" id="custom-chevron"></i>
            </button>
            
            <div id="custom-step-panel" class="hidden mt-3">
                <div class="glass-card p-4 flex gap-3">
                    <input type="number" id="custom-step-input" class="input-field flex-1 px-4 py-2 rounded-xl text-white outline-none min-w-0" placeholder="輸入步數" min="1" max="50000">
                    <button id="btn-custom-submit" class="btn-primary px-6 rounded-xl font-bold whitespace-nowrap border-none cursor-pointer flex items-center justify-center min-w-[80px]">
                        新增
                        <i class="fa-solid fa-circle-notch fa-spin hidden spinner ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="animate-slide-up" style="animation-delay: 0.3s">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                    🏅 風雲榜
                </h3>
                <span id="leaderboard-month-badge" class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--bg-glass-strong)] border border-[var(--border-subtle)] text-[var(--text-secondary)]">
                    -- 月
                </span>
            </div>
            
            <div class="glass-card overflow-hidden min-h-[150px] relative">
                <div id="leaderboard-loading" class="absolute inset-0 flex items-center justify-center bg-[var(--bg-primary)]/50 backdrop-blur-sm z-10 hidden">
                    <i class="fa-solid fa-circle-notch fa-spin spinner-large text-[var(--accent-orange)]"></i>
                </div>
                <div id="leaderboard-list" class="flex flex-col divide-y divide-[var(--border-subtle)]">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
